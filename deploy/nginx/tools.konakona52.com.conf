server {
  server_name tools.konakona.dev;

  root /var/www/tools.konakona52.com/current;
  index index.html;

  location = /api/chatgpt-share/fetch {
    client_max_body_size 1k;
    limit_req zone=chatgpt_share_fetch burst=3 nodelay;
    limit_conn chatgpt_share_connections 2;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
  }

  location = /api/chatgpt-share/health {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location = /anishelf-cli/cloudkit-callback {
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "AniShelf CLI CloudKit callback reached. Copy the full URL from the address bar and extract ckWebAuthToken.\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  listen [::]:443 ssl; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  listen 80;
  listen [::]:80;
  server_name tools.konakona52.com;
  return 301 https://tools.konakona.dev$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tools.konakona52.com;
  ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://tools.konakona.dev$request_uri;
}
