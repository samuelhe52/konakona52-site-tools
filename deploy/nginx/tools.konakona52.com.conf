server {
  server_name tools.konakona.dev;

  root /var/www/tools.konakona52.com/current;
  index index.html;

  # API bodies and download responses must never spill to temporary files.
  client_max_body_size 4k;
  client_body_buffer_size 8k;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_max_temp_file_size 0;
  limit_req_status 429;
  limit_conn_status 429;
  error_page 413 = @api_too_large;
  error_page 429 = @api_rate_limited;
  error_page 502 503 504 = @api_unavailable;

  location ~ ^/api/chatgpt-share/(fetch|export)$ {
    access_log off;
    limit_req zone=chatgpt_share_fetch burst=3 nodelay;
    limit_conn chatgpt_share_connections 2;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
  }

  location /api/ {
    access_log off;
    limit_req zone=tools_conversion burst=10 nodelay;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
  }

  location = /api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"not_found"}';
  }

  location @api_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":"request_too_large"}';
  }

  location @api_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 60 always;
    return 429 '{"error":"rate_limited"}';
  }

  location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"upstream_unavailable"}';
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /openapi.json {
    default_type application/json;
    try_files $uri =404;
  }

  location = /anishelf-cli/cloudkit-callback {
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "AniShelf CLI CloudKit callback reached. Copy the full URL from the address bar and extract ckWebAuthToken.\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  listen [::]:443 ssl; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  listen 80;
  listen [::]:80;
  server_name tools.konakona52.com;
  return 301 https://tools.konakona.dev$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tools.konakona52.com;
  ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://tools.konakona.dev$request_uri;
}
